name: RBAC CI

on:
  push:
    branches:
      - agent/enterprise-rbac-multi-user
  pull_request:
    branches:
      - dev-v2
    paths:
      - 'core/**'
      - 'agent/**'
      - 'frontend/src/api/interface/auth.ts'
      - '.github/workflows/rbac-ci.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Create generated web embed placeholders
        run: |
          mkdir -p cmd/server/web/assets cmd/server/web/static
          test -f cmd/server/web/index.html || printf '<!doctype html><html></html>\n' > cmd/server/web/index.html
          printf 'placeholder\n' > cmd/server/web/assets/.rbac-ci
          printf '{}\n' > cmd/server/web/static/rbac-ci.json
      - name: Test RBAC and compile affected core packages
        run: >-
          go test
          ./app/rbac
          ./app/auth
          ./app/service
          ./app/api/v2
          ./utils/xpack/helper
          ./router
          ./init/migration/...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Compile website RBAC integration
        run: go test ./middleware ./app/service ./router

  frontend-auth-interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check the modified auth contract
        run: >-
          npx tsc --noEmit --skipLibCheck
          --target ES2022
          --module ESNext
          --moduleResolution Bundler
          src/api/interface/auth.ts
