name: RBAC CI

on:
  pull_request:
    branches:
      - dev-v2
    paths:
      - 'core/**'
      - 'frontend/src/api/interface/auth.ts'
      - '.github/workflows/rbac-ci.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Test RBAC and compile affected core packages
        run: >-
          go test
          ./app/rbac
          ./app/auth
          ./app/service
          ./app/api/v2
          ./utils/xpack/helper
          ./router
          ./init/migration/...

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
